name: Prueba de Compilación y Release Completo

on:
  push:
    tags:
      - 'v*' # Matchea v1.2.3 (stable) y v1.2.3-beta.1 / -alpha.1 / -rc.1 (beta)

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 1. Clonar repositorio
      uses: actions/checkout@v4

    # --- CONFIGURAR Y COMPILAR REACT ---
    - name: 2.a Configurar Node.js (Para React)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 2.b Instalar dependencias y compilar React
      run: |
        cd client-react
        npm install
        npm run build
        # Esto creará la carpeta 'dist' en tiempo de ejecución dentro de la nube

    # --- CONFIGURAR PYTHON ---
    - name: 3. Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 4. Instalar dependencias de Python
      run: |
        python -m pip install --upgrade pip
        if (Test-Path "server-flask/requirements.txt") {
          pip install -r server-flask/requirements.txt
        }
        pip install pyinstaller

    # --- DETECTAR CANAL E INYECTAR VERSIÓN DEL TAG EN LA APP ---
    - name: 5.a Generar version.txt desde el tag
      id: channel
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        $isBeta = ($version -match '-(beta|alpha|rc|dev)')
        $isBetaStr = $isBeta.ToString().ToLower()

        Set-Content -Path "server-flask/version.txt" -Value $version -NoNewline
        echo "version=$version" >> $env:GITHUB_OUTPUT 
        echo "is_beta=$isBetaStr" >> $env:GITHUB_OUTPUT 

        Write-Output "Version: $version | Canal Beta: $isBetaStr"

    - name: 5.b Compilar ejecutable con PyInstaller
      run: |
        cd server-flask
        
        $PLAYWRIGHT_DIR = python -c "import os, playwright; print(os.path.dirname(playwright.__file__))"
        echo "La ruta dinámica de Playwright es: $PLAYWRIGHT_DIR"

        pyinstaller --clean --name "SaludsaActas" --noconfirm --onedir -w `
          --add-data "../client-react/dist;dist" `
          --add-data "src/templates;src/templates" `
          --add-data "version.txt;." `
          --add-data "$PLAYWRIGHT_DIR\driver;playwright\driver" `
          --hidden-import win32com `
          --hidden-import pythoncom `
          --hidden-import docxtpl `
          --hidden-import playwright `
          main.py

    # --- COMPILAR EL AGENTE DE ACTUALIZACIÓN ---
    - name: 5.c Compilar SaludsaUpdaterAgent
      run: |
        cd server-flask
        pyinstaller --onefile --name SaludsaUpdaterAgent src/infrastructure/updater/agent_entry.py
 
    # --- COMPILAR INSTALADOR FINAL ---
    - name: 6.a Compilar Instalador con Inno Setup
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.channel.outputs.version }} saludsa.iss

    # --- GENERAR MANIFIESTO DE ACTUALIZACIÓN ---
    - name: 6.b Generar version.json (manifiesto de auto-actualización)
      run: |
        $isBeta = "{{ steps.channel.outputs.is_beta }}" -eq "true"
        $manifestName = if ($isBeta) { "version-beta.json" } else { "version.json" }
        $downloadBase = if ($isBeta) {
            "https://github.com/dekoov/Saludsa-Control-de-Actas-TI/releases/download/beta"
          } else {
            "https://github.com/dekoov/Saludsa-Control-de-Actas-TI/releases/latest/download"
        }

        $version = "${{ github.ref_name }}".TrimStart('v')
        $sha256 = (Get-FileHash "Output/SaludsaActas_Setup.exe" -Algorithm SHA256).Hash.ToLower()
        $manifest = @{
          version      = "${{ steps.channel.outputs.version }}"
          sha256       = $sha256
          url          = "$downloadBase/SaludsaActas_Setup.exe"
          published_at = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
        } | ConvertTo-Json

        Set-Content -Path "Output/$manifestName" -Value $manifest
        Write-Output "Manifiesto ($manifestName):"
        Write-Output $manifest

    # --- PUBLICAR EN GITHUB ---
    - name: 7. Crear Release Oficial en GitHub
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.channel.outputs.is_beta == 'true' && 'beta' || github.ref_name }}
        name: ${{ steps.channel.outputs.is_beta == 'true' && 'CanalBeta' || format('Saludsa Actas {0}', github.ref_name) }}
        draft: false
        prerelease: ${{ steps.channel.outputs.is_beta }}
        files: |
          Output/SaludsaActas_Setup.exe
          Output/${{ steps.channel.outputs.is_beta == 'true' && 'version-beta.json || 'version.json' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
